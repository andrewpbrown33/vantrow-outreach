<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Nudgerow mark">
  <!-- Nudgerow mark: the Signal (small cut, <28px — nav, inline, favicon).
       Same geometry as mark.svg, one step heavier for optical weight:
       ball cx33 r14, arcs stroke 8, radii 21/31/41, same spans.
       Ball signal amber #887200 never moves (re-cut from family camel
       #B8956A, 2026-10-04; 4.51:1 on soft vs camel's 2.5:1); arcs the brand
       deep, damson #403243 (re-cut from ink #4A4952, 2026-09-30, D9). -->
  <path d="M46.5 33.9 A21 21 0 0 1 46.5 66.1" fill="none" stroke="#403243" stroke-width="8" stroke-linecap="round"/>
  <path d="M58.4 32.2 A31 31 0 0 1 58.4 67.8" fill="none" stroke="#403243" stroke-width="8" stroke-linecap="round"/>
  <path d="M70.2 32.7 A41 41 0 0 1 70.2 67.3" fill="none" stroke="#403243" stroke-width="8" stroke-linecap="round"/>
  <circle cx="33" cy="50" r="14" fill="#887200"/>
</svg>
