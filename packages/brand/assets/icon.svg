<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Nudgerow favicon: the Signal on an rx-22 soft tile — the family's
       favicon convention (brand geometry on the family tile, same construction
       as Eaverow's and Parcelrow's icons). Nudgerow soft #FAFAF7, arcs damson,
       ball signal amber #887200 — 4.51:1 on the tile, where the retired camel was
       2.5:1. That gap mattered most exactly here, at 16px. -->
  <rect width="100" height="100" rx="22" fill="#FAFAF7"/>
  <path d="M46.5 33.9 A21 21 0 0 1 46.5 66.1" fill="none" stroke="#403243" stroke-width="8" stroke-linecap="round"/>
  <path d="M58.4 32.2 A31 31 0 0 1 58.4 67.8" fill="none" stroke="#403243" stroke-width="8" stroke-linecap="round"/>
  <path d="M70.2 32.7 A41 41 0 0 1 70.2 67.3" fill="none" stroke="#403243" stroke-width="8" stroke-linecap="round"/>
  <circle cx="33" cy="50" r="14" fill="#887200"/>
