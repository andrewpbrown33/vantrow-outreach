name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # The engine invariant suite (phase-4 §1) runs against real Postgres —
    # never mocks. Locally it provisions the machine's cluster; here it gets a
    # service container and hard-fails if the database is missing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Design law + state-palette pin run before install — no deps needed, fast fail.
      - run: bash scripts/check-design-law.sh
      - run: node scripts/check-state-palette.mjs
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: pnpm build
  spec:
    name: Vantrow Connect spec + fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx -y @redocly/cli@latest lint docs/specs/vantrow-connect/openapi.yaml
      - run: node scripts/validate-connect-fixtures.mjs
